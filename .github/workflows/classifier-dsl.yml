name: Repository Contracts

permissions:
  contents: read

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "PROCESS.md"
      - "deps.edn"
      - "bb.edn"
      - "scripts/media.clj"
      - "docs/classifier-dsl.md"
      - "docs/harnesses/**"
      - "docs/research/**"
      - "docs/adrs/**"
      - "docs/designs/**"
      - "docs/process/**"
      - "docs/kanban/**"
      - "docs/kanban-docs/**"
      - "openhax.kanban.json"
      - ".opencode/AGENTS.md"
      - ".opencode/skills/calliope-corpus/SKILL.md"
      - "src/calliope/**"
      - "resources/classifiers/**"
      - "test/calliope/**"
      - ".github/workflows/classifier-dsl.yml"
  push:
    branches: [main]
    paths:
      - "AGENTS.md"
      - "PROCESS.md"
      - "deps.edn"
      - "bb.edn"
      - "scripts/media.clj"
      - "docs/classifier-dsl.md"
      - "docs/harnesses/**"
      - "docs/research/**"
      - "docs/adrs/**"
      - "docs/designs/**"
      - "docs/process/**"
      - "docs/kanban/**"
      - "docs/kanban-docs/**"
      - "openhax.kanban.json"
      - ".opencode/AGENTS.md"
      - ".opencode/skills/calliope-corpus/SKILL.md"
      - "src/calliope/**"
      - "resources/classifiers/**"
      - "test/calliope/**"
      - ".github/workflows/classifier-dsl.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          show-progress: false
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install eta-mu/Rheos
        run: npm install --global eta-mu@1.1.1
      - name: Read board through Rheos
        run: |
          eta-mu --version
          eta-mu kanban count
          eta-mu kanban list
          eta-mu kanban find ft-000b-define-media-workbench-domain-laws
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: 1.12.2.1565
          bb: 1.13.219
      - name: Run Clojure tests
        run: clojure -M:test
